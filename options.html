<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>RSI Assist - Configuration</title>
	<style>
		body {
			max-width: 800px;
			margin: 40px auto;
			padding: 0 20px;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background-color: #f9f9fb;
			color: #24292e;
		}
		h1 {
			font-size: 24px;
			color: #0060df;
			margin-bottom: 24px;
		}
		.card {
			background: #ffffff;
			border: 1px solid #cbccd1;
			border-radius: 8px;
			padding: 20px;
			margin-bottom: 20px;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
		}
		h2 {
			font-size: 18px;
			margin-top: 0;
			color: #24292e;
			border-bottom: 1px solid #e1e4e8;
			padding-bottom: 8px;
		}
		button {
			cursor: pointer;
			padding: 8px 16px;
			border-radius: 4px;
			border: none;
			font-size: 14px;
			font-weight: 500;
		}
		.btn-primary {
			background-color: #0060df;
			color: white;
		}
		.btn-primary:hover {
			background-color: #003bad;
		}
		.btn-secondary {
			background-color: #e1e4e8;
			color: #24292e;
		}
		.btn-secondary:hover {
			background-color: #d1d5da;
		}
		.btn-danger {
			background-color: #d73a49;
			color: white;
		}
		.btn-danger:hover {
			background-color: #b31d28;
		}
		.actions {
			display: flex;
			gap: 12px;
			margin-top: 16px;
		}
		.status {
			font-size: 14px;
			color: #28a745;
			margin-top: 12px;
			font-weight: 500;
		}
		table {
			width: 100%;
			border-collapse: collapse;
			margin-top: 12px;
		}
		th, td {
			text-align: left;
			padding: 10px;
			border-bottom: 1px solid #e1e4e8;
		}
		th {
			background-color: #f1f3f5;
			font-weight: 600;
		}
	</style>
</head>
<body>
	<h1>RSI Assist - Configuration générale</h1>
	
	<div class="card">
		<h2>Sauvegarde et Restauration</h2>
		<p>Exportez ou importez toutes vos données de configuration (snippets, listes flottantes, positions) au format JSON.</p>
		<div class="actions">
			<button id="export-btn" class="btn-primary">Exporter toutes les données</button>
			<button id="import-btn" class="btn-secondary">Importer des données</button>
			<input type="file" id="import-file" accept=".json" style="display: none;">
		</div>
		<div id="status" class="status"></div>
	</div>

	<div class="card">
		<h2>Sites configurés</h2>
		<p>Liste des sites et des snippets enregistrés.</p>
		<div id="domains-list">
			Chargement...
		</div>
	</div>

	<script src="options.js"></script>
</body>
</html>
